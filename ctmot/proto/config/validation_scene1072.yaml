dataset:
  root: /home/allen-5070ti/dataset/nuScenes/full_trainval
  version: v1.0-trainval
  split: val
source:
  results_path: Fusion_Poly_EXP/result/nusc_config_high/results.json
  trace_root: Fusion_Poly_EXP/inspection/nusc_config_high
case:
  scene: scene-1072
  track_id: 102
  anchor_frame: 19  # 0-based; corrected posterior after this keyframe
  query_frames: [20]
  query_kind: keyframe
  gt_instance_id: d1ecbeefbbd54baaa9d83a959f90cbad  # Evaluation only
prediction:
  models: [cv, ca]
  velocity_source: posterior_state
  vertical_policy: hold  # vz=az=0; preserve the same posterior Z
acceleration:
  source: accepted_detection_velocity
  estimator: linear_least_squares
  history_observations: 4  # Maximum; birth observations are excluded
  minimum_observations: 3
  insufficient_history: skip_ca
comparison:
  box_geometry: baseline_prediction  # Same size/yaw, replace center only
  run_hungarian: false
  detection_gt_max_xy_m: 2.0  # Evaluation correspondence radius, not tracker gate
solver:
  rtol: 1.0e-9
  atol: 1.0e-11
  max_step_s: 0.1
output:
  root: ctmot/proto/outputs

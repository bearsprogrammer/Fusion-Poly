services:
  fusionpoly:
    image: fusionpoly:py37-xquartz
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace/Fusion-Poly
    init: true
    stdin_open: true
    tty: true
    shm_size: "1gb"
    environment:
      DISPLAY: host.docker.internal:0
      XAUTHORITY: /tmp/fusionpoly.Xauthority
      # Render in Linux Mesa; XQuartz presents the window on macOS.
      # Do NOT force LIBGL_ALWAYS_INDIRECT: modern OpenGL is required.
      LIBGL_ALWAYS_SOFTWARE: "true"
      GALLIUM_DRIVER: llvmpipe
      LIBGL_DRI3_DISABLE: "1"
      QT_X11_NO_MITSHM: "1"
    volumes:
      - type: bind
        source: ${HOME}/allen_workspace/git/baseline_3DMOT/Fusion-Poly
        target: /workspace/Fusion-Poly
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/dataset/nuScenes
        target: /data/nuScenes
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.cache/fusionpoly/Xauthority
        target: /tmp/fusionpoly.Xauthority
        read_only: true
        bind:
          create_host_path: false
